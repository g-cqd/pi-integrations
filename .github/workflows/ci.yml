name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run test:coverage
      - name: Offline provider registration
        run: |
          # Writes synthetic OAuth credentials into a throwaway Pi config dir
          # (the domains accept no API-key configuration) and checks that all
          # five domains register. Offline mode makes no network request.
          PI_CMD="bun node_modules/@earendil-works/pi-coding-agent/dist/cli.js" \
            ./scripts/smoke-registration.sh
